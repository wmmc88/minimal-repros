[package]
name = "umdf-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 33

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.5"

[dependencies]
main_shared_lib = { path = "../../crates/main_shared_lib" }

[features]
default = []

[profile.release]
lto = true
